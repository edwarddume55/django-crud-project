apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: django-monitor
  namespace: default
  labels:
    release: monitoring
    app: django-app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: django-app
  endpoints:
  - port: http 
    path: /metrics
    interval: 15s